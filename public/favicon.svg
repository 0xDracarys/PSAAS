<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dragonFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00" />
      <stop offset="45%" stop-color="#ff9f1c" />
      <stop offset="80%" stop-color="#8052ff" />
      <stop offset="100%" stop-color="#00d2d3" />
    </linearGradient>
    <linearGradient id="fireCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="60%" stop-color="#ffb829" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="url(#dragonFlame)" stroke-width="1.5"/>

  <!-- Stylized Geometric Dragon Head & Breath of Fire -->
  <g filter="url(#flameGlow)" transform="translate(6, 6)">
    <!-- Dragon Horn & Crest Top -->
    <path d="M12 4 L22 14 L16 16 L28 10 L22 22 L32 18 L26 28 L38 22 L30 34 L46 26 C40 38 28 44 14 42 C6 41 2 34 2 24 C2 14 6 6 12 4 Z" fill="url(#dragonFlame)" opacity="0.95" />
    
    <!-- Dragon Eye Slot (Cybernetic Glow) -->
    <polygon points="16,20 22,22 18,25 14,23" fill="#ffffff" />
    
    <!-- Dragon Inner Fire Breath / Core Flare -->
    <path d="M26 30 Q36 28 46 22 Q40 34 32 38 Q28 34 26 30 Z" fill="url(#fireCore)" />
    <circle cx="44" cy="22" r="2.5" fill="#ffb829" />
    <circle cx="48" cy="18" r="1.5" fill="#ff4500" />
    <circle cx="50" cy="24" r="1" fill="#ffffff" />
  </g>
</svg>
